[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchproof"
version = "0.3.0"
requires-python = ">=3.12,<3.14"
dependencies = [
 "fastapi==0.128.2", "uvicorn==0.40.0", "pydantic==2.13.5", "python-multipart==0.0.22",
 "sqlalchemy==2.0.50", "alembic==1.17.2", "httpx==0.28.1", "psycopg[binary]==3.2.12",
 "tree-sitter==0.25.2", "tree-sitter-language-pack==0.13.0", "z3-solver==4.15.4.0"
]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.14.10", "mypy==1.18.2", "pip-audit==2.10.0", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
include = ["packages*", "apps*"]

[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]

[tool.ruff]
line-length=120
exclude=["apps/web", "benchmarks/results", ".venv"]
